server:
  port: 8081

spring:
  application:
    name: ledgerline-backend-test
  datasource:
    url: jdbc:h2:mem:ledgerline_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 25
      minimum-idle: 5
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false
  flyway:
    enabled: false

ledgerline:
  security:
    jwt:
      secret: c3VwZXJfc2VjdXJlX2Jhbmtpbmdfand0X3NlY3JldF9rZXlfbGVkZ2VybGluZV8yMDI2X2FwaV92YWxpZGF0aW9u
      expiration-ms: 3600000
  system:
    vault-account-number: SYSTEM_VAULT_INR
