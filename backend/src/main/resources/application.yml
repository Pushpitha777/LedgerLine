server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: ledgerline-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledgerline_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

ledgerline:
  security:
    jwt:
      secret: ${JWT_SECRET:c3VwZXJfc2VjdXJlX2Jhbmtpbmdfand0X3NlY3JldF9rZXlfbGVkZ2VybGluZV8yMDI2X2FwaV92YWxpZGF0aW9u}
      expiration-ms: 86400000 # 24 hours
  system:
    vault-account-number: SYSTEM_VAULT_INR
