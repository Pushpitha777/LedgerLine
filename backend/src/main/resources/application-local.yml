server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: ledgerline-backend-local
  datasource:
    url: jdbc:h2:mem:ledgerline_local;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 25
      minimum-idle: 5
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
  flyway:
    enabled: false

ledgerline:
  security:
    jwt:
      secret: c3VwZXJfc2VjdXJlX2Jhbmtpbmdfand0X3NlY3JldF9rZXlfbGVkZ2VybGluZV8yMDI2X2FwaV92YWxpZGF0aW9u
      expiration-ms: 86400000 # 24 hours
  system:
    vault-account-number: SYSTEM_VAULT_INR
